server:
  port: ${PORT:8100}

spring:
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_HOST:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kafkadb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
