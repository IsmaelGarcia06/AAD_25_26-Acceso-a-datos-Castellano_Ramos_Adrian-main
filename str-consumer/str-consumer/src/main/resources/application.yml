server:
  port: ${PORT:8100}

spring:
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_HOST:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kafkadb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect